# Demo pipeline for the git-status mod: one test that passes, one that fails.
name: CI demo

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-succeeds:
    name: test (succeeds)
    runs-on: ubuntu-latest
    steps:
      - name: Run passing test
        run: |
          echo "1 + 1 should be 2"
          test $((1 + 1)) -eq 2
          echo "1 passed, 0 failed"

  test-fails:
    name: test (fails)
    runs-on: ubuntu-latest
    steps:
      - name: Run failing test
        run: |
          echo "1 + 1 should be 3"
          test $((1 + 1)) -eq 3 || { echo "0 passed, 1 failed"; exit 1; }
